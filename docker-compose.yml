services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: frameflow
      POSTGRES_PASSWORD: frameflow
      POSTGRES_DB: frameflow
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameflow -d frameflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: frameflow
      POSTGRES_PWD: frameflow
      POSTGRES_SEEDS: postgres
    ports: ["${TEMPORAL_PORT:-7233}:7233"]
    healthcheck:
      test: ["CMD", "temporal", "task-queue", "describe", "--address", "temporal:7233", "--task-queue", "frameflow-generation-v1", "--command-timeout", "5s"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  temporal-ui:
    image: temporalio/ui:2.41.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${WEB_PORT:-3001}
    ports: ["${TEMPORAL_UI_PORT:-8081}:8080"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: frameflow
      MINIO_ROOT_PASSWORD: frameflow-local-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://frameflow:frameflow@postgres:5432/frameflow
      TEMPORAL_ADDRESS: temporal:7233
      API_PUBLIC_BASE_URL: http://localhost:${API_PORT:-8000}
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      STORAGE_ACCESS_KEY: frameflow
      STORAGE_SECRET_KEY: frameflow-local-secret
      STORAGE_BUCKET_REFERENCE: project-reference-private
      STORAGE_BUCKET_FORMATS: project-derived-formats
      STORAGE_BUCKET_GENERATION: project-generation-assets
      STORAGE_BUCKET_RENDERS: project-final-renders
      EXECUTION_BACKEND: temporal
      GENERATION_PROVIDER_MODE: ${GENERATION_PROVIDER_MODE:-live}
      REFERENCE_PROVIDER_MODE: ${REFERENCE_PROVIDER_MODE:-live}
      VIDEO_DOWNLOADER_PROVIDER: ${VIDEO_DOWNLOADER_PROVIDER:-yt-dlp}
      YT_DLP_EXECUTABLE: ${YT_DLP_EXECUTABLE:-yt-dlp}
      YT_DLP_IMPERSONATE_TARGET: ${YT_DLP_IMPERSONATE_TARGET:-chrome}
      YT_DLP_IMPERSONATE_DOMAINS: ${YT_DLP_IMPERSONATE_DOMAINS:-tiktok.com}
      YT_DLP_IMPERSONATE_ATTEMPTS: ${YT_DLP_IMPERSONATE_ATTEMPTS:-6}
      SCENE_SEARCH_PROVIDER_MODE: ${SCENE_SEARCH_PROVIDER_MODE:-live}
      FORMAT_PROVIDER_MODE: ${FORMAT_PROVIDER_MODE:-live}
      SUBTITLE_ALIGNMENT_MODE: ${SUBTITLE_ALIGNMENT_MODE:-live}
      REFERENCE_ANALYSIS_MODE: ${REFERENCE_ANALYSIS_MODE:-live}
      REFERENCE_ANALYSIS_MODEL: ${REFERENCE_ANALYSIS_MODEL:-google.text.fast}
      REFERENCE_AUDIO_SEPARATOR: ${REFERENCE_AUDIO_SEPARATOR:-demucs}
      DEMUCS_EXECUTABLE: ${DEMUCS_EXECUTABLE:-demucs}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_SPEECH_LOCATION: ${GOOGLE_SPEECH_LOCATION:-us}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_VIDEO_OUTPUT_GCS_URI: ${GOOGLE_VIDEO_OUTPUT_GCS_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      CODEX_HOME: /root/.codex
      CODEX_EXECUTABLE: codex
      CLAUDE_CODE_EXECUTABLE: claude
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      FAL_KEY: ${FAL_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_TRAINING_BUCKET: ${R2_TRAINING_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_TRAINING_PREFIX: ${R2_TRAINING_PREFIX:-lora-training}
      R2_PRESIGNED_URL_TTL_SECONDS: ${R2_PRESIGNED_URL_TTL_SECONDS:-3600}
      HOLISTIC_LANDMARKER_MODEL_PATH: /root/.cache/mediapipe/holistic_landmarker.task
      HOLISTIC_LANDMARKER_MODEL_URL: https://storage.googleapis.com/mediapipe-models/holistic_landmarker/holistic_landmarker/float16/latest/holistic_landmarker.task
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    volumes:
      - demucs_cache:/root/.cache
      - mediapipe_cache:/root/.cache/mediapipe
      - ${FRAMEFLOW_CODEX_AUTH_DIR:-./.local/codex}:/root/.codex
      - ${FRAMEFLOW_IMPORTS_DIR:-./imports}:/imports:ro

  temporal-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.temporal_runtime"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://frameflow:frameflow@postgres:5432/frameflow
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: frameflow-generation-v1
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      STORAGE_ACCESS_KEY: frameflow
      STORAGE_SECRET_KEY: frameflow-local-secret
      STORAGE_BUCKET_REFERENCE: project-reference-private
      STORAGE_BUCKET_FORMATS: project-derived-formats
      STORAGE_BUCKET_GENERATION: project-generation-assets
      STORAGE_BUCKET_RENDERS: project-final-renders
      GENERATION_PROVIDER_MODE: ${GENERATION_PROVIDER_MODE:-live}
      REFERENCE_PROVIDER_MODE: ${REFERENCE_PROVIDER_MODE:-live}
      VIDEO_DOWNLOADER_PROVIDER: ${VIDEO_DOWNLOADER_PROVIDER:-yt-dlp}
      YT_DLP_EXECUTABLE: ${YT_DLP_EXECUTABLE:-yt-dlp}
      YT_DLP_IMPERSONATE_TARGET: ${YT_DLP_IMPERSONATE_TARGET:-chrome}
      YT_DLP_IMPERSONATE_DOMAINS: ${YT_DLP_IMPERSONATE_DOMAINS:-tiktok.com}
      YT_DLP_IMPERSONATE_ATTEMPTS: ${YT_DLP_IMPERSONATE_ATTEMPTS:-6}
      SCENE_SEARCH_PROVIDER_MODE: ${SCENE_SEARCH_PROVIDER_MODE:-live}
      FORMAT_PROVIDER_MODE: ${FORMAT_PROVIDER_MODE:-live}
      SUBTITLE_ALIGNMENT_MODE: ${SUBTITLE_ALIGNMENT_MODE:-live}
      REFERENCE_ANALYSIS_MODE: ${REFERENCE_ANALYSIS_MODE:-live}
      REFERENCE_ANALYSIS_MODEL: ${REFERENCE_ANALYSIS_MODEL:-google.text.fast}
      REFERENCE_AUDIO_SEPARATOR: ${REFERENCE_AUDIO_SEPARATOR:-demucs}
      DEMUCS_EXECUTABLE: ${DEMUCS_EXECUTABLE:-demucs}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_SPEECH_LOCATION: ${GOOGLE_SPEECH_LOCATION:-us}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_VIDEO_OUTPUT_GCS_URI: ${GOOGLE_VIDEO_OUTPUT_GCS_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      CODEX_HOME: /root/.codex
      CODEX_EXECUTABLE: codex
      CLAUDE_CODE_EXECUTABLE: claude
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      FAL_KEY: ${FAL_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_TRAINING_BUCKET: ${R2_TRAINING_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_TRAINING_PREFIX: ${R2_TRAINING_PREFIX:-lora-training}
      R2_PRESIGNED_URL_TTL_SECONDS: ${R2_PRESIGNED_URL_TTL_SECONDS:-3600}
      HOLISTIC_LANDMARKER_MODEL_PATH: /root/.cache/mediapipe/holistic_landmarker.task
      HOLISTIC_LANDMARKER_MODEL_URL: https://storage.googleapis.com/mediapipe-models/holistic_landmarker/holistic_landmarker/float16/latest/holistic_landmarker.task
    volumes:
      - demucs_cache:/root/.cache
      - mediapipe_cache:/root/.cache/mediapipe
      - ${FRAMEFLOW_CODEX_AUTH_DIR:-./.local/codex}:/root/.codex

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    depends_on: [api]
    ports: ["${WEB_PORT:-3001}:3000"]

volumes:
  postgres_data:
  minio_data:
  demucs_cache:
  mediapipe_cache:
