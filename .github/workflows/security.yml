name: Security

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  PIP_AUDIT_VERSION: 2.10.1
  PIP_TOOLS_VERSION: 7.6.1

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan Git history with redacted output
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          "$GITLEAKS_IMAGE"
          git
          --config=/repo/.gitleaks.toml
          --gitleaks-ignore-path=/repo/.gitleaksignore
          --redact
          --no-banner
          /repo

  dependency-review:
    name: Dependency changes
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          config-file: ./.github/dependency-review-config.yml

  node-dependencies:
    name: Node dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  python-dependencies:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - name: Install audit tooling
        run: pip install "pip-audit==$PIP_AUDIT_VERSION" "pip-tools==$PIP_TOOLS_VERSION"
      - name: Validate expiring exceptions
        run: python scripts/security/dependency_exceptions.py
      - name: Test security policy helpers
        run: python -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Verify the committed lock is reproducible
        run: |
          cp apps/api/requirements.lock.txt /tmp/frame-flow-requirements.lock.txt
          pip-compile \
            --quiet \
            --generate-hashes \
            --no-annotate \
            --no-header \
            --strip-extras \
            --resolver=backtracking \
            --output-file /tmp/frame-flow-requirements.lock.txt \
            apps/api/requirements.txt
          diff -u apps/api/requirements.lock.txt /tmp/frame-flow-requirements.lock.txt
      - name: Audit locked dependencies
        run: python scripts/security/python_audit.py

  repository-scan:
    name: Repository configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  source-sbom:
    name: Source SBOM and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          config: .syft.yaml
          format: spdx-json
          output-file: frame-flow-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Apply license review policy
        run: python scripts/security/check_sbom_licenses.py frame-flow-source.spdx.json
      - name: Upload source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frame-flow-source-sbom
          path: frame-flow-source.spdx.json
          retention-days: 30

  container-images:
    name: Container ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-worker
            dockerfile: apps/api/Dockerfile
            image: frame-flow-api:security
          - name: web
            dockerfile: apps/web/Dockerfile
            image: frame-flow-web:security
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}" .
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          artifact-name: frame-flow-${{ matrix.name }}.spdx.json
          output-file: frame-flow-${{ matrix.name }}.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Scan fixable image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
